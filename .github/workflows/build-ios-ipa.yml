name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned iOS IPA for TrollStore
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@56f84321dbccf38fb67ce29ab63e4754056677e0 # v1.85.1
        with:
          toolchain: 1.85.0

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Build iOS app resources and Rust libraries
        run: task --verbose build:ios RELEASE=1

      - name: Build iOS app without code signing
        run: >-
          xcodebuild
          -project "safari/Yomikiri.xcodeproj"
          -scheme "Yomikiri (iOS)"
          -configuration Release
          -destination "generic/platform=iOS"
          -derivedDataPath "$RUNNER_TEMP/YomikiriDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/YomikiriDerivedData/Build/Products/Release-iphoneos/Yomikiri.app"
          test -d "$app_path" || { echo "::error::Xcode did not produce Yomikiri.app at $app_path"; exit 1; }
          mkdir -p "$RUNNER_TEMP/YomikiriIPA/Payload" safari/build
          ditto "$app_path" "$RUNNER_TEMP/YomikiriIPA/Payload/Yomikiri.app"
          (cd "$RUNNER_TEMP/YomikiriIPA" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/safari/build/Yomikiri-unsigned.ipa")

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: yomikiri-ios-unsigned-trollstore
          path: safari/build/Yomikiri-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
